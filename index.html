<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bray Exclusive Royal Spa — Booking</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        body{background:linear-gradient(135deg,#0f0f1a,#1a1a2e);min-height:100vh;color:#fff;padding:20px;}
        .container{max-width:600px;margin:0 auto;}
        h1{text-align:center;color:#d4af37;margin-bottom:5px;}
        .subtitle{text-align:center;color:#aaa;margin-bottom:30px;}
        .form-card{background:rgba(255,255,255,0.03);border-radius:16px;padding:30px;border:1px solid rgba(212,175,55,0.2);}
        label{display:block;margin:15px 0 5px;color:#d4af37;font-weight:500;}
        input, select, textarea{width:100%;padding:12px 15px;background:rgba(255,255,255,0.05);border:1px solid rgba(212,175,55,0.3);border-radius:8px;color:#fff;font-size:15px;}
        input:focus, select:focus, textarea:focus{outline:none;border-color:#d4af37;}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
        .price-display{background:rgba(212,175,55,0.1);border-radius:8px;padding:15px;margin-top:20px;display:none;}
        .price-display.show{display:block;}
        .price-row{display:flex;justify-content:space-between;padding:5px 0;}
        .price-total{border-top:1px solid #d4af37;margin-top:8px;padding-top:10px;font-weight:bold;font-size:18px;color:#d4af37;}
        button{width:100%;padding:16px;background:#25d366;color:white;border:none;border-radius:8px;font-size:17px;font-weight:bold;margin-top:25px;cursor:pointer;transition:0.3s;}
        button:hover{background:#1fb855;transform:translateY(-2px);}
        .back-link{display:inline-block;margin-top:25px;color:#d4af37;text-decoration:none;}
        .back-link:hover{text-decoration:underline;}
    </style>
</head>
<body><!-- MENU NAVIGASI -->
<div style="background: #d4af37; padding: 15px; text-align: center; margin-bottom: 20px;">
  <a href="index.html" style="color: white; margin: 0 10px; text-decoration: none; font-weight: bold;">🏠 Beranda</a>
  <a href="Pemesanan.html" style="color: white; margin: 0 10px; text-decoration: none; font-weight: bold;">📋 Booking</a>
  <a href="Beranda.html" style="color: white; margin: 0 10px; text-decoration: none; font-weight: bold;">💆 Treatment</a>
  <a href="Halaman tamu.html" style="color: white; margin: 0 10px; text-decoration: none; font-weight: bold;">👤 Tentang Kami</a>
  <a href="Chat_tamu.html" style="color: white; margin: 0 10px; text-decoration: none; font-weight: bold;">💬 Hubungi</a>
</div>
    <div class="container">
        <h1>👑 Bray Exclusive Royal Spa</h1>
        <p class="subtitle">Formulir Reservasi — Isi data di bawah ini</p>

        <div class="form-card">
            <form id="bookingForm">
                <label>Nama Lengkap Anda *</label>
                <input type="text" id="nama" placeholder="Contoh: Sari Dewi" required>

                <label>Nomor WhatsApp *</label>
                <input type="tel" id="wa" placeholder="Contoh: 08123456789" required>

                <label>Area Layanan *</label>
                <select id="area" required>
                    <option value="">— Pilih Area —</option>
                    <option value="Bali">Bali</option>
                    <option value="Jakarta">Jakarta</option>
                    <option value="Bogor">Bogor</option>
                    <option value="Depok">Depok</option>
                    <option value="Tangerang">Tangerang</option>
                    <option value="Bekasi">Bekasi</option>
                    <option value="Cimahi">Cimahi</option>
                </select>

                <label>Kota / Daerah Spesifik</label>
                <input type="text" id="kota" placeholder="Contoh: Seminyak / Kebayoran Baru">

                <label>Jenis Lokasi *</label>
                <select id="lokasiTipe" required>
                    <option value="">— Pilih —</option>
                    <option value="Hotel">Hotel</option>
                    <option value="Villa">Villa</option>
                    <option value="Residensi / Rumah">Residensi / Rumah</option>
                    <option value="Apartemen">Apartemen</option>
                </select>

                <label>Nama Tempat / Alamat Lengkap *</label>
                <textarea id="alamat" rows="2" placeholder="Nama hotel + nomor kamar, atau alamat lengkap rumah" required></textarea>

                <div class="row">
                    <div>
                        <label>Tanggal Booking *</label>
                        <input type="date" id="tanggal" required>
                    </div>
                    <div>
                        <label>Jam Kedatangan *</label>
                        <input type="time" id="jam" required>
                    </div>
                </div>

                <label>Pilihan Treatment *</label>
                <select id="treatment" onchange="updatePrice()" required>
                    <option value="">— Pilih Treatment —</option>
                    <option value="Traditional Balinese Massage">Traditional Balinese Massage</option>
                    <option value="Deep Tissue Massage">Deep Tissue Massage</option>
                    <option value="Thai Massage">Thai Massage</option>
                    <option value="Reflexology">Reflexology</option>
                    <option value="Couple Massage">Couple Massage</option>
                    <option value="Four Hand Massage">Four Hand Massage</option>
                    <option value="Body to Body">Body to Body</option>
                </select>

                <label>Durasi *</label>
                <select id="durasi" onchange="updatePrice()" required>
                    <option value="">— Pilih Durasi —</option>
                    <option value="60">60 Menit</option>
                    <option value="90">90 Menit</option>
                    <option value="120">120 Menit</option>
                </select>

                <label>Jumlah Tamu</label>
                <select id="jumlahTamu">
                    <option value="1">1 Orang</option>
                    <option value="2">2 Orang</option>
                </select>

                <div class="price-display" id="priceBox">
                    <div class="price-row">
                        <span>Treatment:</span>
                        <span id="showTreatment">-</span>
                    </div>
                    <div class="price-row">
                        <span>Durasi:</span>
                        <span id="showDurasi">-</span>
                    </div>
                    <div class="price-row price-total">
                        <span>Total Estimasi:</span>
                        <span id="showPrice">-</span>
                    </div>
                </div>

                <label>Catatan / Permintaan Khusus</label>
                <textarea id="catatan" rows="3" placeholder="Contoh: Terapis pria, suhu ruangan, dll. (opsional)"></textarea>

                <button type="submit">💬 Konfirmasi Booking via WhatsApp</button>
            </form>

            <a href="index.html" class="back-link">← Kembali ke Halaman Utama</a>
        </div>
    </div>

    <script>
        const harga = {
            "Traditional Balinese Massage": {60: 250000, 90: 300000, 120: 350000},
            "Deep Tissue Massage": {60: 250000, 90: 300000, 120: 350000},
            "Thai Massage": {60: 250000, 90: 300000, 120: 350000},
            "Reflexology": {60: 250000, 90: 300000, 120: 350000},
            "Couple Massage": {60: 800000, 90: 850000, 120: 1000000},
            "Four Hand Massage": {60: 650000, 90: 750000, 120: 800000},
            "Body to Body": {60: 800000, 90: 1000000, 120: 1200000}
        };

        function updatePrice() {
            const treatment = document.getElementById('treatment').value;
            const durasi = parseInt(document.getElementById('durasi').value);
            const priceBox = document.getElementById('priceBox');

            if(treatment && durasi) {
                const price = harga[treatment][durasi];
                priceBox.classList.add('show');
                document.getElementById('showTreatment').textContent = treatment;
                document.getElementById('showDurasi').textContent = durasi + ' Menit';
                document.getElementById('showPrice').textContent = 'Rp ' + price.toLocaleString('id-ID');
            } else {
                priceBox.classList.remove('show');
            }
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e){
            e.preventDefault();
            
            const nama = document.getElementById('nama').value;
            const wa = document.getElementById('wa').value;
            const area = document.getElementById('area').value;
            const kota = document.getElementById('kota').value;
            const lokasiTipe = document.getElementById('lokasiTipe').value;
            const alamat = document.getElementById('alamat').value;
            const tanggal = document.getElementById('tanggal').value;
            const jam = document.getElementById('jam').value;
            const treatment = document.getElementById('treatment').value;
            const durasi = document.getElementById('durasi').value;
            const jumlahTamu = document.getElementById('jumlahTamu').value;
            const catatan = document.getElementById('catatan').value || 'Tidak ada';
            
            const totalHarga = harga[treatment][durasi];

            const pesan = `Halo Bray Exclusive Royal Spa 👋

Saya ingin melakukan reservasi:

📋 DATA PEMESANAN:
──────────────────────
👤 Nama: ${nama}
📱 WhatsApp: ${wa}
📍 Area: ${area} — ${kota}
🏨 Lokasi: ${lokasiTipe}
📝 Alamat: ${alamat}

📅 Tanggal: ${tanggal}
⏰ Jam: ${jam}

💆 Treatment: ${treatment}
⏱️ Durasi: ${durasi} menit
👥 Jumlah Tamu: ${jumlahTamu}
💰 Estimasi Harga: Rp ${totalHarga.toLocaleString('id-ID')}

📝 Catatan: ${catatan}

Mohon konfirmasi ketersediaan terapis. Terima kasih 🙏`;

            const url = "https://wa.me/6285739581203?text=" + encodeURIComponent(pesan);
            window.open(url, '_blank');
        });
    </script>
</body>
</html>
