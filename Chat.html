<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bray Royal Spa — Chat Internal</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        :root {--gold: #d4af37; --dark: #0f0f1a; --card: #1a1a2e; --bubble-tamu: #2a2a4a; --bubble-terapis: #1e4d3a; --text-light: #eee; --text-muted: #888;}
        body{background:var(--dark);color:#fff;height:100vh;display:flex;flex-direction:column;}
        
        /* === HEADER CHAT === */
        .chat-header{background:var(--card);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(212,175,55,0.15);}
        .back-btn{color:var(--gold);text-decoration:none;font-size:0.9em;}
        .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#b8962f);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#000;}
        .user-info h3{font-size:0.95em;}
        .user-info p{font-size:0.8em;color:var(--text-muted);}
        .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#25d366;margin-right:6px;}
        
        /* === AREA PESANAN === */
        .chat-messages{flex:1;overflow-y:auto;padding:16px;background:rgba(0,0,0,0.2);}
        .msg{max-width:75%;margin-bottom:16px;display:flex;}
        .msg.tamu{justify-content:flex-end;}
        .msg.terapis{justify-content:flex-start;}
        .bubble{padding:10px 14px;border-radius:18px;font-size:0.95em;line-height:1.4;position:relative;}
        .tamu .bubble{background:var(--bubble-tamu);border-bottom-right-radius:4px;}
        .terapis .bubble{background:var(--bubble-terapis);border-bottom-left-radius:4px;}
        .msg-time{font-size:0.7em;color:var(--text-muted);margin-top:4px;text-align:right;}
        
        /* === TOMBOL CEPAT === */
        .quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px;background:var(--card);border-top:1px solid rgba(212,175,55,0.1);}
        .quick-btn{padding:8px 6px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,175,55,0.2);border-radius:8px;color:#fff;font-size:0.75em;cursor:pointer;transition:0.2s;text-align:center;}
        .quick-btn:hover{background:rgba(212,175,55,0.15);border-color:var(--gold);color:var(--gold);}
        .quick-btn.warn{border-color:rgba(245,158,11,0.4);}
        .quick-btn.danger{border-color:rgba(239,68,68,0.4);}
        
        /* === KETIK PESANAN === */
        .input-area{display:flex;gap:10px;padding:12px 16px;background:var(--card);border-top:1px solid rgba(212,175,55,0.15);}
        .input-area input{flex:1;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(212,175,55,0.2);border-radius:24px;color:#fff;font-size:0.95em;}
        .input-area input:focus{outline:none;border-color:var(--gold);}
        .send-btn{width:42px;height:42px;border-radius:50%;background:var(--gold);border:none;color:#000;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
        
        /* === INFO ORDER === */
        .order-info{background:rgba(212,175,55,0.05);border-bottom:1px solid rgba(212,175,55,0.15);padding:10px 16px;font-size:0.85em;color:#aaa;}
        .order-info strong{color:var(--gold);}
        .hidden{display:none !important;}
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="chat-header">
        <a href="index.html" class="back-btn">← Kembali</a>
        <div class="avatar" id="chatAvatar">S</div>
        <div class="user-info">
            <h3 id="chatName">Sari</h3>
            <p><span class="status-dot"></span><span id="chatStatus">Order Diterima</span></p>
        </div>
    </div>

    <!-- INFO ORDER -->
    <div class="order-info" id="orderInfoBar">
        📋 Order #<span id="orderId">BRY-00125</span> &nbsp;|&nbsp; 💆 <span id="orderTreatment">Deep Tissue — 90 Menit</span> &nbsp;|&nbsp; 📍 <span id="orderLocation">Hotel ABC</span>
    </div>

    <!-- AREA PESANAN -->
    <div class="chat-messages" id="chatBox">
        <!-- PESANAN OTOMATIS SISTEM -->
        <div style="text-align:center;margin:15px 0;font-size:0.8em;color:#666;">
            📅 <span id="todayDate"></span> &nbsp;|&nbsp; 🔒 Pesan ini terlindungi sistem Bray
        </div>
    </div>

    <!-- TOMBOL CEPAT -->
    <div class="quick-actions" id="quickActionsBar">
        <button class="quick-btn" onclick="kirimCepat('Saya sedang menuju lokasi')">🚗 OTW</button>
        <button class="quick-btn" onclick="kirimCepat('Saya sudah tiba di lokasi')">📍 Tiba</button>
        <button class="quick-btn warn" onclick="kirimCepat('Mohon tunggu sebentar, saya terlambat sekitar 10 menit')">⏰ Terlambat</button>
        <button class="quick-btn danger" onclick="hubungiAdmin()">❓ Hubungi Admin</button>
    </div>

    <!-- KETIK PESANAN -->
    <div class="input-area">
        <input type="text" id="pesanInput" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter')kirimPesan()">
        <button class="send-btn" onclick="kirimPesan()">➤</button>
    </div>

    <script>
        // === DATA ORDER ===
        const orderData = {
            id: 'BRY-00125',
            tamuNama: 'Andi',
            tamuId: 'T-1001',
            terapisNama: 'Sari',
            terapisId: 'TR-008',
            treatment: 'Deep Tissue — 90 Menit',
            lokasi: 'Hotel ABC, Lantai 5 Kamar 512',
            peran: 'tamu' // isi dengan 'terapis' jika yang buka adalah terapis
        };

        // === INISIALISASI ===
        document.getElementById('todayDate').textContent = new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
        document.getElementById('orderId').textContent = orderData.id;
        document.getElementById('orderTreatment').textContent = orderData.treatment;
        document.getElementById('orderLocation').textContent = orderData.lokasi;

        // Sesuaikan tampilan berdasarkan peran
        function initPeran() {
            const avatar = document.getElementById('chatAvatar');
            const name = document.getElementById('chatName');
            
            if(orderData.peran === 'tamu') {
                avatar.textContent = orderData.terapisNama.charAt(0);
                name.textContent = orderData.terapisNama;
                // Tamu tidak perlu tombol OTW/Tiba
                document.querySelector('.quick-btn:nth-child(1)').style.display = 'none';
                document.querySelector('.quick-btn:nth-child(2)').style.display = 'none';
            } else {
                avatar.textContent = orderData.tamuNama.charAt(0);
                name.textContent = orderData.tamuNama;
            }
        }
        initPeran();

        // === KIRIM PESAN ===
        function kirimPesan() {
            const input = document.getElementById('pesanInput');
            const teks = input.value.trim();
            if(!teks) return;
            
            tambahPesan(teks, 'saya');
            input.value = '';
            simpanPesan(teks, orderData.peran);
            
            // Simulasi balasan otomatis untuk demo
            if(orderData.peran === 'tamu' && teks.length > 0) {
                setTimeout(() => {
                    tambahPesan('Baik, saya segera ke lokasi Kak 🙏', 'terapis');
                }, 1500);
            }
        }

        // === KIRIM PESAN CEPAT ===
        function kirimCepat(teks) {
            tambahPesan(teks, 'saya');
            simpanPesan(teks, orderData.peran);
        }

        // === HUBUNGI ADMIN ===
        function hubungiAdmin() {
            window.open('https://wa.me/6285739581203?text=' + encodeURIComponent('Saya butuh bantuan terkait Order #' + orderData.id), '_blank');
        }

        // === TAMBAH PESAN KE LAYAR ===
        function tambahPesan(teks, pengirim) {
            const chatBox = document.getElementById('chatBox');
            const waktu = new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
            
            const div = document.createElement('div');
            div.className = `msg ${pengirim === 'saya' ? orderData.peran === 'tamu' ? 'tamu' : 'terapis' : orderData.peran === 'tamu' ? 'terapis' : 'tamu'}`;
            div.innerHTML = `
                <div class="bubble">
                    ${teks}
                    <div class="msg-time">${waktu}</div>
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // === SIMPAN KE PENYIMPANAN LOKAL ===
        function simpanPesan(teks, pengirim) {
            const riwayat = JSON.parse(localStorage.getItem('chat_'+orderData.id) || '[]');
            riwayat.push({
                teks: teks,
                pengirim: pengirim,
                waktu: new Date().toISOString()
            });
            localStorage.setItem('chat_'+orderData.id, JSON.stringify(riwayat));
        }

        // === MUAT RIWAYAT PESAN ===
        function muatRiwayat() {
            const riwayat = JSON.parse(localStorage.getItem('chat_'+orderData.id) || '[]');
            riwayat.forEach(p => {
                const pihak = p.pengirim === orderData.peran ? 'saya' : 'lain';
                tambahPesan(p.teks, pihak);
            });
        }
        
        // Muat riwayat saat halaman dibuka
        muatRiwayat();
    </script>
</body>
</html>
